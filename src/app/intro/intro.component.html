<main class="intro-container" id="main-content" tabindex="-1">
  <video #backgroundVideo 
       class="background-video"
       autoplay 
       playsinline
       (canplay)="onVideoCanPlay()"
       (error)="onVideoError($event)"
       (ended)="onVideoEnded()">
  </video>
  
  <h1 class="intro-title">William Hogarth's Humours of an Election
    <div class="progress-bar-container" 
         *ngIf="!isVideoLoading && !showContent"
         (click)="onProgressBarClick($event)">
      <mat-progress-bar mode="determinate" [value]="videoProgress" class="video-progress-bar"></mat-progress-bar>
    </div>
    <div class="title-controls" *ngIf="!showPlayButton">
      <button mat-icon-button 
              (click)="toggleVideoPause()" 
              class="pause-button"
              *ngIf="!showContent"
              type="button"
              [attr.aria-label]="isVideoPaused ? 'Resume introduction video' : 'Pause introduction video'"
              [matTooltip]="isVideoPaused ? 'Resume Video' : 'Pause Video'">
        <mat-icon>{{ isVideoPaused ? 'play_arrow' : 'pause' }}</mat-icon>
      </button>
      <button mat-stroked-button (click)="skipVideo()" *ngIf="!showContent" class="skip-button" matTooltip="Skip Video" type="button" aria-label="Skip introduction video">
        <mat-icon>skip_next</mat-icon>
        Skip
      </button>
      <button mat-stroked-button (click)="playAgain()" *ngIf="showContent" class="play-again-button" matTooltip="Play Video Again" type="button" aria-label="Play introduction video again">
        <mat-icon>replay</mat-icon>
        Play Again
      </button>
    </div>
    
    <!-- Menu Button - always visible, positioned independently -->
    <div class="menu-button-container">
      <button mat-icon-button 
              (click)="toggleMenu()"
              [class.menu-open]="isMenuOpen"
              class="menu-button-inline"
              type="button"
              [attr.aria-expanded]="isMenuOpen"
              aria-controls="intro-menu-panel"
              [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
              matTooltip="Menu">
        <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </h1>

  <!-- Play button overlay -->
  <div class="play-button-overlay" *ngIf="showPlayButton">
    <button mat-fab color="primary" (click)="onPlayButtonClick()" class="play-button" type="button" aria-label="Play introduction video">
      <mat-icon>play_arrow</mat-icon>
    </button>
    <p>Click to start the experience</p>
  </div>
  
  <div class="intro-content" [class.show]="showContent">
    <button mat-raised-button color="primary" (click)="startViewer()" *ngIf="showStartButton" type="button" aria-label="Explore the paintings viewer">
      Explore
    </button>
  </div>

  <!-- Menu Overlay -->
  <div class="menu-overlay" 
       *ngIf="isMenuOpen" 
      aria-hidden="true"
       (click)="closeMenu()"></div>

  <!-- Menu Panel -->
    <div class="menu-panel" 
      id="intro-menu-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Main menu"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
       [class.menu-open]="isMenuOpen">
    <div class="menu-content">
      <h3>William Hogarth's Humours of an Election</h3>
      
      <div class="menu-item">
        <button mat-stroked-button 
                (click)="startViewer()"
          type="button"
                class="about-button"> 
          View Paintings →
        </button>
      </div>
      
      <div class="menu-item">
        <button mat-stroked-button 
                (click)="openAboutModal()"
                type="button"
                class="about-button"> 
          Acknowledgments
        </button>
      </div>
    </div>
  </div>

  <!-- Acknowledgments Modal - Update to match viewer pattern -->
  <app-acknowledgments-modal 
       [isOpen]="isAboutModalOpen"
       (closeModal)="onModalClose()">
  </app-acknowledgments-modal>
</main>
