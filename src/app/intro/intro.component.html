<div class="intro-container">
  <video class="background-video" 
         autoplay 
         muted 
         playsinline 
         preload="auto"
         #backgroundVideo 
         (ended)="onVideoEnded()"
         (canplay)="onVideoCanPlay()"
         (error)="onVideoError($event)">
    <source src="assets/videos/Hogarth3.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  
  <h1 class="intro-title">Hogarth's Election Series
    <div class="progress-bar-container" *ngIf="!isVideoLoading && !showContent">
      <mat-progress-bar mode="determinate" [value]="videoProgress" class="video-progress-bar"></mat-progress-bar>
    </div>
    <div class="title-controls" *ngIf="!showContent && !showPlayButton">
    <button mat-icon-button 
            (click)="toggleVideoPause()" 
            class="pause-button"
            [matTooltip]="isVideoPaused ? 'Resume Video' : 'Pause Video'">
      <mat-icon>{{ isVideoPaused ? 'play_arrow' : 'pause' }}</mat-icon>
    </button>
  </div>
  </h1>
  
  <!-- Play button overlay -->
  <div class="play-button-overlay" *ngIf="showPlayButton">
    <button mat-fab color="primary" (click)="onPlayButtonClick()" class="play-button">
      <mat-icon>play_arrow</mat-icon>
    </button>
    <p>Click to start the experience</p>
  </div>
  
  <div class="intro-content" [class.show]="showContent">
    <button mat-raised-button color="primary" (click)="startViewer()" *ngIf="showStartButton">
      Start Exploring
    </button>
  </div>

  <div class="skip-button-container">
    <button mat-button color="accent" (click)="skipVideo()" *ngIf="!showContent">
      Skip
    </button>
    <button mat-button color="accent" (click)="playAgain()" *ngIf="showContent">
      Play Again
    </button>
  </div>
</div>
